<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thrivepoint" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Thrivepoint</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    /* ─── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f0f1a;
      --surface:    #1a1a2e;
      --surface2:   #22223b;
      --border:     #2e2e4a;
      --accent:     #7c3aed;
      --accent2:    #a855f7;
      --gold:       #f59e0b;
      --green:      #10b981;
      --red:        #ef4444;
      --text:       #f1f5f9;
      --text-muted: #94a3b8;
      --radius:     16px;
      --radius-sm:  10px;
      --safe-top:   env(safe-area-inset-top, 0px);
      --safe-bot:   env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ─── App Shell ─────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ─── Views ─────────────────────────────────────────────── */
    .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* ─── PIN Screen ────────────────────────────────────────── */
    #view-pin {
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 24px;
      padding-top: calc(var(--safe-top) + 40px);
    }

    .pin-logo {
      font-size: 56px;
      line-height: 1;
    }

    .pin-title {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
    }

    .pin-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
    }

    .pin-dots {
      display: flex;
      gap: 16px;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .pin-dot.filled {
      background: var(--accent2);
      border-color: var(--accent2);
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .pin-key {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 22px;
      font-weight: 600;
      height: 68px;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .pin-key:active { background: var(--accent); transform: scale(0.95); }
    .pin-key.del { font-size: 18px; }
    .pin-key.empty { visibility: hidden; }

    .pin-error {
      color: var(--red);
      font-size: 13px;
      min-height: 18px;
      text-align: center;
    }

    /* ─── Profile Select ────────────────────────────────────── */
    #view-profiles {
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px 24px;
      padding-top: calc(var(--safe-top) + 40px);
    }

    .profiles-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
    }

    .profiles-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .profiles-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .profile-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
      min-width: 130px;
      -webkit-tap-highlight-color: transparent;
    }

    .profile-card:active { transform: scale(0.95); }
    .profile-card:hover { border-color: var(--accent2); background: var(--surface2); }

    .profile-avatar {
      font-size: 52px;
      line-height: 1;
      margin-bottom: 10px;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 700;
    }

    .profile-points {
      font-size: 13px;
      color: var(--gold);
      margin-top: 4px;
      font-weight: 600;
    }

    .parent-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 14px;
      padding: 10px 24px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .parent-btn:hover { color: var(--text); border-color: var(--accent2); }

    /* ─── Kid Dashboard ─────────────────────────────────────── */
    #view-kid {
      flex-direction: column;
      overflow: hidden;
    }

    .kid-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      padding-top: calc(var(--safe-top) + 16px);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .kid-header-avatar { font-size: 32px; }

    .kid-header-info { flex: 1; }

    .kid-header-name {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .kid-header-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .kid-header-points {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 20px;
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .kid-header-points-num {
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      color: #fff;
    }

    .kid-header-points-label {
      font-size: 10px;
      color: rgba(255,255,255,0.75);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ─── Tab Bar ───────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 12px 8px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent2); }

    /* ─── Scrollable Content ────────────────────────────────── */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      padding-bottom: calc(var(--safe-bot) + 16px);
    }

    /* ─── Tab Panels ────────────────────────────────────────── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ─── Progress Bar ──────────────────────────────────────── */
    .progress-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .progress-banner-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-label { font-size: 13px; color: var(--text-muted); }
    .progress-count { font-size: 13px; font-weight: 700; color: var(--gold); }

    .progress-track {
      background: var(--border);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.4s ease;
    }

    /* ─── Category Section ──────────────────────────────────── */
    .category-section { margin-bottom: 20px; }

    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .category-icon { font-size: 18px; }

    .category-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .category-badge {
      margin-left: auto;
      background: var(--surface2);
      border-radius: 99px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .category-badge.complete {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
    }

    /* ─── Task Card ─────────────────────────────────────────── */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .task-card:active { transform: scale(0.98); }

    .task-card.done {
      background: rgba(16, 185, 129, 0.06);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .task-card.skipped {
      opacity: 0.45;
    }

    .task-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
      font-size: 14px;
    }

    .task-card.done .task-check {
      background: var(--green);
      border-color: var(--green);
    }

    .task-card.done .task-check::after { content: '✓'; color: #fff; font-weight: 700; }

    .task-info { flex: 1; }

    .task-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .task-card.done .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .task-points {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      flex-shrink: 0;
    }

    .task-card.done .task-points { color: var(--text-muted); }

    /* ─── Rewards Tab ───────────────────────────────────────── */
    .rewards-header {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .rewards-balance-label {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rewards-balance-num {
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .rewards-balance-unit {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
    }

    .rewards-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .reward-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .reward-card:active { transform: scale(0.98); }
    .reward-card.affordable { border-color: rgba(124, 58, 237, 0.4); }
    .reward-card.affordable:hover { border-color: var(--accent2); background: var(--surface2); }
    .reward-card.locked { opacity: 0.5; cursor: not-allowed; }

    .reward-icon { font-size: 30px; flex-shrink: 0; }

    .reward-info { flex: 1; }

    .reward-title { font-size: 15px; font-weight: 600; }

    .reward-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .reward-cost {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .reward-cost-num {
      font-size: 18px;
      font-weight: 800;
      color: var(--gold);
    }

    .reward-cost-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ─── Ledger Tab ────────────────────────────────────────── */
    .ledger-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ledger-icon { font-size: 22px; flex-shrink: 0; }

    .ledger-info { flex: 1; }

    .ledger-title { font-size: 14px; font-weight: 600; }

    .ledger-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .ledger-delta {
      font-size: 16px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .ledger-delta.earn { color: var(--green); }
    .ledger-delta.spend { color: var(--red); }

    /* ─── Parent Dashboard ──────────────────────────────────── */
    #view-parent {
      flex-direction: column;
      overflow: hidden;
    }

    .parent-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      padding-top: calc(var(--safe-top) + 16px);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .parent-header-title {
      font-size: 18px;
      font-weight: 700;
      flex: 1;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent2);
      font-size: 15px;
      cursor: pointer;
      padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .parent-kid-tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      gap: 4px;
      flex-shrink: 0;
    }

    .parent-kid-tab {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      padding: 12px 16px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .parent-kid-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

    .parent-stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .parent-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: center;
    }

    .parent-stat-num {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent2);
    }

    .parent-stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .parent-week-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .week-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .week-row-day { font-size: 14px; font-weight: 600; }

    .week-row-tasks { font-size: 12px; color: var(--text-muted); }

    .week-row-pts {
      font-size: 16px;
      font-weight: 800;
      color: var(--gold);
    }

    /* ─── Toast ─────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: calc(var(--safe-bot) + 24px);
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
      pointer-events: none;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── Modal ─────────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal-sheet {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 24px;
      padding-bottom: calc(var(--safe-bot) + 24px);
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      margin: 0 auto 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal-cost-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 99px;
      padding: 6px 16px;
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .modal-actions { display: flex; gap: 12px; }

    .btn {
      flex: 1;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text-muted); }

    /* ─── Confetti ──────────────────────────────────────────── */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 9999;
      animation: confettiFall 1.2s ease-in forwards;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* ─── Update Banner ─────────────────────────────────────────────────────────────── */
    #update-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      padding: calc(var(--safe-top) + 10px) 16px 10px;
      animation: slideDown 0.3s ease;
    }
    #update-banner.show { display: block; }
    @keyframes slideDown {
      from { transform: translateY(-100%); }
      to   { transform: translateY(0); }
    }
  </style>
</head>
<body>
<!-- ── Update Banner ─────────────────────────────────────────────────────────────── -->
<div id="update-banner">✅ App updated! Reloading…</div>
<div id="app">

  <!-- ── PIN Screen ──────────────────────────────────────────── -->
  <div id="view-pin" class="view active">
    <div class="pin-logo">🌟</div>
    <div>
      <div class="pin-title">Thrivepoint</div>
      <div class="pin-subtitle">Summer Challenge</div>
    </div>
    <div class="pin-dots">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>
    <div class="pin-error" id="pin-error"></div>
    <div class="pin-keypad">
      <button class="pin-key" data-key="1">1</button>
      <button class="pin-key" data-key="2">2</button>
      <button class="pin-key" data-key="3">3</button>
      <button class="pin-key" data-key="4">4</button>
      <button class="pin-key" data-key="5">5</button>
      <button class="pin-key" data-key="6">6</button>
      <button class="pin-key" data-key="7">7</button>
      <button class="pin-key" data-key="8">8</button>
      <button class="pin-key" data-key="9">9</button>
      <button class="pin-key empty"></button>
      <button class="pin-key" data-key="0">0</button>
      <button class="pin-key del" data-key="del">⌫</button>
    </div>
  </div>

  <!-- ── Profile Select ─────────────────────────────────────── -->
  <div id="view-profiles" class="view">
    <div class="profiles-title">Who's checking in? 👋</div>

<script>
// ─── Cloudflare Worker API ───────────────────────────────────────────────────

const API = 'https://thrivepoint-api.zgauba.workers.dev';
let PIN = '1234'; // updated after config loads

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API}${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'X-Thrivepoint-Pin': PIN,
      ...(options.headers || {}),
    },
  });
  if (!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}

// ─── App Data ────────────────────────────────────────────────────────────────

const DEFAULT_CONFIG = {

  ],
  rewards: [

    { id: "r2", icon: "⏭️", title: "Skip a Task Tomorrow",  desc: "Skip one task tomorrow (not the same one twice in a row).", cost: 15, type: "daily" },
    { id: "r3", icon: "💵", title: "$5 In-App Purchase",    desc: "A $5 in-app purchase of your choice.", cost: 95, type: "weekly" },
    { id: "r4", icon: "🎬", title: "Movie Theater",         desc: "A trip to the movies!", cost: 120, type: "weekly" },
    { id: "r5", icon: "🔐", title: "Escape Room",           desc: "An escape room adventure!", cost: 150, type: "weekly" },
    { id: "r6", icon: "💡", title: "Your Suggestion",       desc: "Suggest a reward to Mom & Dad.", cost: 100, type: "weekly" }
  ]
};

// ─── API Helpers ────────────────────────────────────────────────────────────────

// In-memory cache to avoid redundant API calls within a session
const _cache = { ledgers: {}, today: {}, config: null };

async function getConfig() {
  if (_cache.config) return _cache.config;
  try {
    _cache.config = await apiFetch('/api/config');
  } catch (e) {
    _cache.config = DEFAULT_CONFIG;
  }
  PIN = _cache.config.pin || '1234';
  return _cache.config;
}

async function getLedger(kidId) {
  if (_cache.ledgers[kidId]) return _cache.ledgers[kidId];
  try {
    _cache.ledgers[kidId] = await apiFetch(`/api/ledger?kidId=${kidId}`);
  } catch (e) {
    _cache.ledgers[kidId] = [];
  }
  return _cache.ledgers[kidId];
}

async function getToday(kidId) {
  if (_cache.today[kidId]) return _cache.today[kidId];
  try {
    _cache.today[kidId] = await apiFetch(`/api/today?kidId=${kidId}`);
  } catch (e) {
    _cache.today[kidId] = { completedTaskIds: [], rewardIds: [] };
  }
  return _cache.today[kidId];
}

async function getBalance(kidId) {
  const ledger = await getLedger(kidId);
  return ledger.reduce((sum, e) => sum + e.delta, 0);
}

// ─── State ────────────────────────────────────────────────────────────────

let cfg = DEFAULT_CONFIG; // will be replaced by API data on load
let activeKidId = null;
let activeParentKidId = null;
let pendingReward = null;
let pinBuffer = '';

// ─── Routing ────────────────────────────────────────────────────────────────

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${id}`).classList.add('active');
}

// ─── PIN Screen ────────────────────────────────────────────────────────────────

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById(`dot-${i}`).classList.toggle('filled', i < pinBuffer.length);
  }
}

async function handlePinKey(key) {
  if (key === 'del') {
    pinBuffer = pinBuffer.slice(0, -1);
    updatePinDots();
    document.getElementById('pin-error').textContent = '';
    return;
  }
  if (pinBuffer.length >= 4) return;
  pinBuffer += key;
  updatePinDots();
  if (pinBuffer.length === 4) {
    // Validate against config PIN (loaded from API)
    const correctPin = cfg.pin || '1234';
    if (pinBuffer === correctPin) {
      PIN = correctPin;
      pinBuffer = '';
      updatePinDots();
      await renderProfiles();
      showView('profiles');
    } else {
      document.getElementById('pin-error').textContent = 'Incorrect PIN. Try again.';
      pinBuffer = '';
      updatePinDots();
    }
  }
}

document.querySelectorAll('.pin-key').forEach(btn => {
  btn.addEventListener('click', () => handlePinKey(btn.dataset.key));
});

// ─── Profile Select ────────────────────────────────────────────────────────────────

async function renderProfiles() {
  cfg = await getConfig();
  const grid = document.getElementById('profiles-grid');
  grid.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px">Loading...</div>';
  const balances = await Promise.all(cfg.kids.map(k => getBalance(k.id)));
  grid.innerHTML = '';
  cfg.kids.forEach((kid, i) => {
    const card = document.createElement('div');
    card.className = 'profile-card';
    card.innerHTML = `
      <div class="profile-avatar">${kid.avatar}</div>
      <div class="profile-name">${kid.name}</div>
      <div class="profile-points">⭐ ${balances[i]} pts</div>
    `;
    card.addEventListener('click', () => openKidDashboard(kid.id));
    grid.appendChild(card);
  });
}

document.getElementById('btn-parent-mode').addEventListener('click', () => {
  openParentDashboard();
});

// ─── Kid Dashboard ────────────────────────────────────────────────────────────────

async function openKidDashboard(kidId) {
  activeKidId = kidId;
  // Invalidate caches for fresh data on each dashboard open
  delete _cache.today[kidId];
  delete _cache.ledgers[kidId];

  const kid = cfg.kids.find(k => k.id === kidId);
  const today = new Date();
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  document.getElementById('kid-header-avatar').textContent = kid.avatar;
  document.getElementById('kid-header-name').textContent = kid.name;
  document.getElementById('kid-header-date').textContent =
    `${days[today.getDay()]}, ${months[today.getMonth()]} ${today.getDate()}`;

  // Reset tabs
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="tasks"]').classList.add('active');
  document.getElementById('panel-tasks').classList.add('active');

  showView('kid');
  await renderTasks();
  await renderRewards();
  await renderLedger();
}

document.getElementById('kid-back').addEventListener('click', async () => {
  await renderProfiles();
  showView('profiles');
});

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
    if (btn.dataset.tab === 'rewards') await renderRewards();
    if (btn.dataset.tab === 'ledger') await renderLedger();
  });
});

function getTodayTasks() {
  // Map Worker frequency field to day-of-week filter
  const dow = new Date().getDay(); // 0=Sun, 5=Fri
  return cfg.tasks.filter(t => {
    if (t.days) return t.days.includes(dow); // legacy format
    const freq = t.frequency || 'daily';
    if (freq === 'daily') return true;
    if (freq === 'friday') return dow === 5;
    if (freq === 'weekend') return dow === 0 || dow === 6;
    return true;
  });
}

async function renderTasks() {
  const todayData = await getToday(activeKidId);
  const completedIds = todayData.completedTaskIds || [];
  const todayTasks = getTodayTasks();
  const balance = await getBalance(activeKidId);

  document.getElementById('kid-header-pts').textContent = balance;

  // Progress
  const done = todayTasks.filter(t => completedIds.includes(t.id)).length;
  const total = todayTasks.length;
  document.getElementById('progress-count').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = total ? `${(done/total)*100}%` : '0%';

  // Group by category
  const list = document.getElementById('tasks-list');
  list.innerHTML = '';

  cfg.categories.forEach(cat => {
    // Support both catId (legacy) and categoryId (Worker format)
    const catTasks = todayTasks.filter(t => (t.catId || t.categoryId) === cat.id);
    if (!catTasks.length) return;

    const catDone = catTasks.filter(t => completedIds.includes(t.id)).length;
    const allDone = catDone === catTasks.length;

    const section = document.createElement('div');
    section.className = 'category-section';
    section.innerHTML = `
      <div class="category-header">
        <span class="category-icon">${cat.icon}</span>
        <span class="category-name">${cat.name}</span>
        <span class="category-badge ${allDone ? 'complete' : ''}">${catDone}/${catTasks.length}</span>
      </div>
    `;

    catTasks.forEach(task => {
      const isDone = completedIds.includes(task.id);
      const card = document.createElement('div');
      card.className = `task-card ${isDone ? 'done' : ''}`;
      card.innerHTML = `
        <div class="task-check"></div>
        <div class="task-info">
          <div class="task-title">${task.title}</div>
        </div>
        <div class="task-points">+${task.points}</div>
      `;
      if (!isDone) card.addEventListener('click', () => toggleTask(task));
      section.appendChild(card);
    });

    list.appendChild(section);
  });
}

async function toggleTask(task) {
  // Optimistic UI update
  const todayData = _cache.today[activeKidId] || { completedTaskIds: [], rewardIds: [] };
  todayData.completedTaskIds.push(task.id);
  _cache.today[activeKidId] = todayData;

  // Optimistic ledger update
  if (!_cache.ledgers[activeKidId]) _cache.ledgers[activeKidId] = [];
  _cache.ledgers[activeKidId].unshift({
    id: `l${Date.now()}`, type: 'earn', taskId: task.id,
    title: task.title, delta: task.points, ts: Date.now()
  });

  showToast(`⭐ +${task.points} pts — ${task.title}`);
  spawnConfetti();
  await renderTasks();

  // Persist to API in background
  try {
    await apiFetch('/api/complete-task', {
      method: 'POST',
      body: JSON.stringify({ kidId: activeKidId, taskId: task.id, taskTitle: task.title, points: task.points })
    });
  } catch (e) {
    showToast('⚠️ Saved locally — will sync when online');
  }
}

// ─── Rewards ────────────────────────────────────────────────────────────────

async function renderRewards() {
  const balance = await getBalance(activeKidId);
  document.getElementById('rewards-balance').textContent = balance;

  const list = document.getElementById('rewards-list');
  list.innerHTML = '';

  cfg.rewards.forEach(reward => {
    const canAfford = balance >= reward.cost;
    const card = document.createElement('div');
    card.className = `reward-card ${canAfford ? 'affordable' : 'locked'}`;
    card.innerHTML = `
      <div class="reward-icon">${reward.icon}</div>
      <div class="reward-info">
        <div class="reward-title">${reward.title}</div>
        <div class="reward-desc">${reward.desc}</div>
      </div>
      <div class="reward-cost">
        <div class="reward-cost-num">${reward.cost}</div>
        <div class="reward-cost-label">pts</div>
      </div>
    `;
    if (canAfford) {
      card.addEventListener('click', () => openRewardModal(reward));
    }
    list.appendChild(card);
  });
}

function openRewardModal(reward) {
  pendingReward = reward;
  document.getElementById('modal-reward-title').textContent = `${reward.icon} ${reward.title}`;
  document.getElementById('modal-reward-desc').textContent = reward.desc;
  document.getElementById('modal-reward-cost').textContent = reward.cost;
  document.getElementById('reward-modal').classList.add('open');
}

document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('reward-modal').classList.remove('open');
  pendingReward = null;
});

document.getElementById('modal-confirm').addEventListener('click', async () => {
  if (!pendingReward) return;
  const balance = await getBalance(activeKidId);
  if (balance < pendingReward.cost) {
    showToast('❌ Not enough points!');
    document.getElementById('reward-modal').classList.remove('open');
    return;
  }

  // Optimistic ledger update
  if (!_cache.ledgers[activeKidId]) _cache.ledgers[activeKidId] = [];
  _cache.ledgers[activeKidId].unshift({
    id: `l${Date.now()}`, type: 'spend', rewardId: pendingReward.id,
    title: pendingReward.title, delta: -pendingReward.cost, ts: Date.now()
  });

  const reward = pendingReward;
  pendingReward = null;
  document.getElementById('reward-modal').classList.remove('open');
  showToast(`🎉 Redeemed: ${reward.title}!`);
  spawnConfetti();
  spawnConfetti();
  await renderRewards();
  document.getElementById('kid-header-pts').textContent = await getBalance(activeKidId);

  // Persist to API in background
  try {
    await apiFetch('/api/redeem-reward', {
      method: 'POST',
      body: JSON.stringify({ kidId: activeKidId, rewardId: reward.id, rewardTitle: reward.title, cost: reward.cost })
    });
  } catch (e) {
    showToast('⚠️ Saved locally — will sync when online');
  }
});

/// ─── Ledger ────────────────────────────────────────────────────────────────

async function renderLedger() {
  const ledger = await getLedger(activeKidId);
  const list = document.getElementById('ledger-list');
  list.innerHTML = '';

  if (!ledger.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px 0;">No activity yet — complete some tasks!</div>';
    return;
  }

  ledger.forEach(entry => {
    const isEarn = entry.delta > 0;
    const item = document.createElement('div');
    item.className = 'ledger-item';
    const icon = isEarn ? (entry.type === 'earn' ? '✅' : '↩️') : '🎁';
    const time = new Date(entry.ts).toLocaleString('en-US', {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
    item.innerHTML = `
      <div class="ledger-icon">${icon}</div>
      <div class="ledger-info">
        <div class="ledger-title">${entry.title}</div>
        <div class="ledger-time">${time}</div>
      </div>
      <div class="ledger-delta ${isEarn ? 'earn' : 'spend'}">
        ${isEarn ? '+' : ''}${entry.delta}
      </div>
    `;
    list.appendChild(item);
  });
}

// ─── Parent Dashboard ────────────────────────────────────────────────────────────────
async function openParentDashboard() {
  activeParentKidId = cfg.kids[0].id;
  renderParentKidTabs();
  showView('parent');
  await renderParentContent();
}

document.getElementById('parent-back').addEventListener('click', async () => {
  await renderProfiles();
  showView('profiles');
});

function renderParentKidTabs() {
  const tabs = document.getElementById('parent-kid-tabs');
  tabs.innerHTML = '';
  cfg.kids.forEach(kid => {
    const btn = document.createElement('button');
    btn.className = `parent-kid-tab ${kid.id === activeParentKidId ? 'active' : ''}`;
    btn.textContent = `${kid.avatar} ${kid.name}`;
    btn.addEventListener('click', async () => {
      activeParentKidId = kid.id;
      renderParentKidTabs();
      await renderParentContent();
    });
    tabs.appendChild(btn);
  });
}

async function renderParentContent() {
  const kid = cfg.kids.find(k => k.id === activeParentKidId);
  const [balance, ledger, todayData] = await Promise.all([
    getBalance(activeParentKidId),
    getLedger(activeParentKidId),
    getToday(activeParentKidId)
  ]);
  const todayTasks = getTodayTasks();
  const completedIds = todayData.completedTaskIds || [];
  const doneTodayCount = todayTasks.filter(t => completedIds.includes(t.id)).length;
  const todayStr = new Date().toISOString().slice(0, 10);
  const earnedToday = ledger
    .filter(e => e.type === 'earn' && new Date(e.ts).toISOString().slice(0,10) === todayStr)
    .reduce((s, e) => s + e.delta, 0);

  const content = document.getElementById('parent-content');
  content.innerHTML = `
    <div class="parent-stat-grid">
      <div class="parent-stat">
        <div class="parent-stat-num">${balance}</div>
        <div class="parent-stat-label">Total Points</div>
      </div>
      <div class="parent-stat">
        <div class="parent-stat-num">${doneTodayCount}</div>
        <div class="parent-stat-label">Tasks Today</div>
      </div>
      <div class="parent-stat">
        <div class="parent-stat-num">${earnedToday}</div>
        <div class="parent-stat-label">Pts Earned Today</div>
      </div>
      <div class="parent-stat">
        <div class="parent-stat-num">${ledger.filter(e=>e.type==='spend').length}</div>
        <div class="parent-stat-label">Rewards Redeemed</div>
      </div>
    </div>
    <div class="parent-week-title">Recent Activity</div>
    <div id="parent-ledger-list"></div>
  `;

  const pList = document.getElementById('parent-ledger-list');
  if (!ledger.length) {
    pList.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px 0;">No activity yet.</div>';
    return;
  }

  ledger.slice(0, 20).forEach(entry => {
    const isEarn = entry.delta > 0;
    const item = document.createElement('div');
    item.className = 'ledger-item';
    const icon = isEarn ? (entry.type === 'earn' ? '✅' : '↩️') : '🎁';
    const time = new Date(entry.ts).toLocaleString('en-US', {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
    item.innerHTML = `
      <div class="ledger-icon">${icon}</div>
      <div class="ledger-info">
        <div class="ledger-title">${entry.title}</div>
        <div class="ledger-time">${time}</div>
      </div>
      <div class="ledger-delta ${isEarn ? 'earn' : 'spend'}">
        ${isEarn ? '+' : ''}${entry.delta}
      </div>
    `;
    pList.appendChild(item);
  });
}

// ─── Toast ────────────────────────────────────────────────────────────────────

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ─── Confetti ─────────────────────────────────────────────────────────────────

function spawnConfetti() {
  const colors = ['#a855f7','#f59e0b','#10b981','#3b82f6','#ef4444','#f472b6'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left: ${Math.random() * 100}vw;
      top: -10px;
      background: ${colors[Math.floor(Math.random()*colors.length)]};
      animation-delay: ${Math.random() * 0.4}s;
      animation-duration: ${0.9 + Math.random() * 0.6}s;
      width: ${6 + Math.random()*8}px;
      height: ${6 + Math.random()*8}px;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

// ─── App Init ────────────────────────────────────────────────────────────────

// Pre-load config so PIN validation works immediately
(async () => {
  try {
    cfg = await getConfig();
    PIN = cfg.pin || '1234';
  } catch (e) {
    cfg = DEFAULT_CONFIG;
  }
})();

// ─── Service Worker + Auto-Update ───────────────────────────────────────────────────────────────

let swReg = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      swReg = await navigator.serviceWorker.register('sw.js');

      // Poll for updates every 60 seconds
      setInterval(() => swReg.update(), 60000);

      // Listen for SW_UPDATED broadcast from the service worker
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data && e.data.type === 'SW_UPDATED') {
          const banner = document.getElementById('update-banner');
          banner.classList.add('show');
          // Reload after 2 seconds so the user can see the banner
          setTimeout(() => window.location.reload(), 2000);
        }
      });
    } catch (err) {
      console.warn('SW registration failed:', err);
    }
  });
}

// Manual “Check for Update” button
document.getElementById('btn-check-update').addEventListener('click', async () => {
  if (swReg) {
    showToast('🔄 Checking for updates…');
    await swReg.update();
  } else {
    showToast('⚠️ Service worker not available');
  }
});
</script>
